name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/featurehub/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: plugins/featurehub/server/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Check committed dist/ matches src/
        run: git diff --exit-code -- dist/ || (echo "dist/index.js is stale. Run 'npm run build' and commit it." && exit 1)
